version: "3.9"

services:
  backend:
    build: ./backend
    container_name: fx-dashboard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./resource_tracker.db

  frontend:
    build: ./frontend
    container_name: fx-dashboard-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
